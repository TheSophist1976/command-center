name: ci

# The gate for every change and every release: unit and integration tests
# (Rust, with the TUI built in), the Playwright end-to-end suite against the
# real binary, and a security audit. Runs on pull requests and on every push
# to main; tag-release.yml only tags a release commit after this passes on
# main, and release.yml calls it again before building anything.

on:
  pull_request:
  push:
    branches: [main]
  # New advisories appear without any code change, so audit main daily too.
  schedule:
    - cron: '17 6 * * *'
  workflow_call:
    secrets:
      SECURITY_ALERTS_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npm run build
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --features tui so the TUI and its tests are compiled and run too.
      - run: cargo test --features tui
      - run: shellcheck -x install.sh tests/install_sh_test.sh
      - run: sh tests/install_sh_test.sh

  e2e:
    name: end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
        env:
          TASK_BIN: ${{ github.workspace }}/target/debug/task
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  security:
    name: security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-audit }
      # Any known vulnerability, or a crate flagged unsound, fails the build.
      - run: cargo audit --deny unsound
      # npm advisories of any severity, dev dependencies included.
      - run: npm audit --audit-level=low
        working-directory: web
      - run: npm audit --audit-level=low
        working-directory: e2e
      # Open alerts on the repository itself (Dependabot, code scanning, secret
      # scanning). GITHUB_TOKEN can not read these, so this needs a token with
      # read access to them in the SECURITY_ALERTS_TOKEN secret.
      - name: No open security alerts on the repository
        env:
          GH_TOKEN: ${{ secrets.SECURITY_ALERTS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::SECURITY_ALERTS_TOKEN is not set, so open Dependabot, code scanning and secret scanning alerts are not checked. The lockfile audits above still ran."
            exit 0
          fi
          failed=0
          check() {
            # $1 label, $2 API path. A 404 means the feature is off for this repo.
            if ! out=$(gh api --paginate "repos/$REPO/$2?state=open&per_page=100" --jq "$3" 2>&1); then
              case "$out" in
                *"no analysis found"*|*"(HTTP 404)"*) echo "$1: not enabled"; return ;;
                *) echo "::error::$1: could not read alerts: $out"; failed=1; return ;;
              esac
            fi
            if [ -n "$out" ]; then
              echo "::error::Open $1 alerts:"
              echo "$out"
              failed=1
            else
              echo "$1: none open"
            fi
          }
          check "Dependabot" dependabot/alerts '.[] | "#\(.number) \(.security_advisory.severity) \(.dependency.package.name): \(.security_advisory.summary)"'
          check "code scanning" code-scanning/alerts '.[] | "#\(.number) \(.rule.severity) \(.rule.description)"'
          check "secret scanning" secret-scanning/alerts '.[] | "#\(.number) \(.secret_type_display_name)"'
          exit $failed

  # One required check for branch protection: passes only when every gate does.
  ci-passed:
    name: ci passed
    if: always()
    needs: [test, e2e, security]
    runs-on: ubuntu-latest
    steps:
      - name: All gates passed
        run: |
          for r in "${{ needs.test.result }}" "${{ needs.e2e.result }}" "${{ needs.security.result }}"; do
            [ "$r" = success ] || { echo "a gate did not pass ($r)"; exit 1; }
          done
